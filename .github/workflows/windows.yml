# The Windows build, which is a RELEASE ARTIFACT rather than a bottle.
#
# Homebrew is the channel on macOS and Linux and is not one here, so Windows
# gets a zip attached to a GitHub release instead -- `algvm.exe` with the
# runtime library beside it, which is the same "complete package" the
# algol24-vm formula installs.
#
# ⚠️ MSYS2 RATHER THAN MSVC, and the reason is the build scripts.
# bootstrap/build.sh and vm/build.sh are POSIX sh, and the library's build.sh
# is too -- so a shell that runs them unchanged is worth more than a native
# toolchain that would need all three rewritten.  mingw-w64 is also what the
# runtime's Windows support was checked with.
#
# ⚠️ THE SHIMS ARE NAMED .so ON WINDOWS TOO, and that is not an oversight.
# A unit declares its shim as `external ... in 'libgraphffi.so'`, the name
# reaches LoadLibraryA exactly as written, and a PE library loads whatever its
# extension says.  Naming them .so on every platform was deliberate and this
# is where it pays.
name: windows

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "bootstrap/**"
      - "compiler/**"
      - "vm/**"
  workflow_dispatch:

# Read at the top, so anything added later starts with none of it.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    # ⚠️ WRITE, for the release step alone, and unused on every other run: a
    # pull request builds and tests the package and attaches nothing.  Actions
    # grants permissions per JOB rather than per step, so the narrowest this
    # gets without splitting the job in two is write here and a tag condition
    # on the one step that needs it.
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libffi is the half the runtime's Windows support was missing: the
      # README records it as checked with mingw-w64 while "the foreign-call
      # half still wants a mingw libffi".  This is that libffi.  SDL2 is for
      # the library's graph and sound.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gdb
            zip

      # STAGE 1 -- the compiler, from the checked-in seed and a C compiler and
      # nothing else.  Known to work: this is what the README means by the
      # runtime compiling for Windows.
      - name: Build algc
        run: |
          ./bootstrap/build.sh
          ./bootstrap/algc --version

      - name: The compiler's own tests
        run: ./bootstrap/algc --test compiler/Main.a24

      # STAGE 2 -- the machine, which ALWAYS needs libffi: a foreign call is a
      # feature of the language [FUN-014], so vm/build.sh fails rather than
      # producing a binary that refuses them.  This is the step that has never
      # run anywhere before.
      - name: Build algvm
        run: |
          ./vm/build.sh
          ./vm/algvm --version

      - name: The machine's own tests
        run: ./test.sh vm/Vm.a24

      # STAGE 3 -- a program, to prove the pair works rather than merely links.
      #
      # ⚠️ SHOWS WHAT EACH ONE SAID BEFORE ASSERTING.  `test "$(...)" = ...`
      # hides both the output and the diagnostic, so a failure here said only
      # `exit code 1` -- and the one time it fired, it took three CI rounds to
      # guess at what no log had recorded.
      - name: Run a program both ways
        run: |
          printf "WriteLn ('hello, ' + Str (2 + 2));\n" > hello.a24

          echo "--- algc ---"
          ./bootstrap/algc hello.a24 || echo "algc exited $?"

          echo "--- algvm, compile only ---"
          ./vm/algvm --stop hello.a24 || echo "stop exited $?"

          echo "--- algvm, Algol-24 dispatch loop ---"
          ./vm/algvm --algol-loop hello.a24 || echo "algol-loop exited $?"

          echo "--- algvm, C dispatch loop (the default) ---"
          ./vm/algvm hello.a24 || echo "c-loop exited $?"

          echo "--- where the C loop dies, if it still does ---"
          gdb -batch -ex run -ex bt -ex "info registers rip" \
              --args ./vm/algvm hello.a24 2>&1 | tail -30 || true

          # Does link-time optimization explain a found-but-wrong address?
          # The probe now calls through the pointer, so if LTO is the cause it
          # should already have rejected the flag -- this says which it is.
          echo "--- rebuilt without LTO ---"
          LTO=0 ./vm/build.sh vm/algvm-nolto
          ./vm/algvm-nolto hello.a24 || echo "no-LTO exited $?"

          echo "--- asserting ---"
          test "$(./bootstrap/algc hello.a24)" = "hello, 4"
          test "$(./vm/algvm --algol-loop hello.a24)" = "hello, 4"
          test "$(./vm/algvm hello.a24)" = "hello, 4"

      # STAGE 4 -- the library, pinned to the same version the Homebrew formula
      # carries, so the three platforms ship one pairing.
      - name: Check out the library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schildawg/algol24-library
          ref: v0.1.0
          path: library

      - name: Build the library's shims
        working-directory: library
        run: ./build.sh

      # STAGE 5 -- the package, and its SHAPE is forced by how Windows finds a
      # DLL.  There is no LD_LIBRARY_PATH here: LoadLibraryA searches the
      # EXECUTABLE's own directory, so the shims go beside algvm.exe -- while
      # the units go in algvm.exe's `lib`, because that is where the compiler
      # looks for an installed library [MOD-002].  Two directories where macOS
      # and Linux need one.
      - name: Assemble the package
        run: |
          OUT="algol24-vm-windows-x86_64"
          mkdir -p "$OUT/lib"

          cp vm/algvm.exe "$OUT/"
          cp library/lib*ffi.so "$OUT/"

          cp library/*.a24 "$OUT/lib/"
          cp library/*.hex library/beep.wav "$OUT/lib/"
          cp library/REFERENCE.md "$OUT/lib/"
          cp README.md spec/ALGOL-24.md "$OUT/"

          # Every mingw library the binaries actually load, found by asking
          # rather than by listing: a list goes stale the first time a flag
          # changes, and a missing DLL fails at startup with a dialog box.
          for F in "$OUT"/algvm.exe "$OUT"/lib*ffi.so; do
            ldd "$F" | awk '/mingw64/ { print $3 }'
          done | sort -u | while read -r DLL; do
            [ -f "$DLL" ] && cp -n "$DLL" "$OUT/"
          done

          # The Windows answer to the Homebrew wrapper: ALGOL24_LIB because
          # `graph` reads its glyph files itself rather than through the
          # compiler, and the directory on PATH so a shim is found however the
          # program was launched.
          #
          # Written with printf rather than a heredoc: inside a YAML block
          # scalar every line is indented, and a heredoc terminator cannot be,
          # so `<<'BAT'` would never close.
          {
            printf '@echo off\r\n'
            printf 'setlocal\r\n'
            printf 'set "ALGOL24_LIB=%%~dp0lib"\r\n'
            printf 'set "PATH=%%~dp0;%%PATH%%"\r\n'
            printf '"%%~dp0algvm.exe" %%*\r\n'
          } > "$OUT/algvm.bat"

          ls "$OUT"
          echo "--- lib ---"
          ls "$OUT/lib" | head -20

      # The installed-layout gate, which has TEETH here and not on a Unix:
      # the defect it guards is FileExists opening a directory, and fopen on
      # one succeeds on macOS and Linux.  Run on Windows it fails; run at home
      # it passes either way, which was checked rather than assumed.
      - name: The installed layout
        run: ./installed.sh

      # STAGE 6 -- the package used as a user would, from a directory holding
      # none of its files.  This is what the whole arrangement exists for, and
      # what failed three separate ways on macOS before it worked.
      - name: Use the package from elsewhere
        env:
          SDL_VIDEODRIVER: dummy
          ALG_SOUND: dummy
        run: |
          OUT="$(pwd)/algol24-vm-windows-x86_64"
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere

          printf "WriteLn ('hello, ' + Str (2 + 2));\n" > hello.a24
          test "$(cmd //c "$(cygpath -w "$OUT")\\algvm.bat" hello.a24 | tr -d '\r')" = "hello, 4"

          printf "uses strings;\n\nWriteLn (ToUpper ('shouting'));\n" > lib.a24
          test "$(cmd //c "$(cygpath -w "$OUT")\\algvm.bat" lib.a24 | tr -d '\r')" = "SHOUTING"

          printf "uses graph;\n\nInitGraph (160, 100, 'test', False);\nOutTextXY (4, 4, 'drawn');\nCloseGraph ();\n" > font.a24
          cmd //c "$(cygpath -w "$OUT")\\algvm.bat" font.a24

      - name: Zip it
        id: zip
        run: |
          # Named for the release it is when there is one, so a downloaded zip
          # says which version it holds -- and `dev` otherwise, which is every
          # run that is not a tag.
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)           VERSION="dev" ;;
          esac

          zip -qr "algol24-vm-$VERSION-windows-x86_64.zip" algol24-vm-windows-x86_64
          ls -la algol24-vm-*-windows-x86_64.zip

          # ⚠️ PUBLISHED AS AN OUTPUT so the release body names the file that
          # actually exists.  The body used to build the name itself from
          # github.ref_name, which keeps the leading 'v' that this step strips
          # -- so v0.2.4's page offered `algol24-vm-v0.2.4-...zip` beside an
          # asset called `algol24-vm-0.2.4-...zip`.  A download link that does
          # not resolve is worse than no link, and two places deriving one name
          # is how it happened.
          echo "name=algol24-vm-$VERSION-windows-x86_64.zip" >> "$GITHUB_OUTPUT"

      - name: Upload what built
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: |
            algol24-vm-*-windows-x86_64.zip
            bootstrap/algc.exe
            vm/algvm.exe
          if-no-files-found: warn

      # ⚠️ ONLY ON A TAG, and this is the first thing in this repository to
      # publish a GitHub RELEASE at all.  The tags have never had one: Homebrew
      # installs from the tarball GitHub generates for a tag, so a release was
      # never needed on macOS or Linux.  Windows has no such channel, so the
      # zip needs somewhere to live and a release page is it.
      #
      # fail_on_unmatched_files, because a release that quietly carries no
      # asset is worse than a failed workflow: the page exists, the download
      # does not, and nothing says so.
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          files: algol24-vm-*-windows-x86_64.zip
          fail_on_unmatched_files: true
          body: |
            ## Windows

            `${{ steps.zip.outputs.name }}` is the
            bytecode machine with the Algol-24 runtime library beside it.
            Unzip it anywhere and run `algvm.bat`, which sets the two things
            the library needs: where its units and glyph files live, and where
            its C shims are.

            Built with mingw-w64, and foreign calls work -- `external` reaches
            a DLL through the same declaration a Unix uses, because the shims
            are named `.so` on every platform on purpose.

            ## macOS and Linux

            ```sh
            brew tap schildawg/algol24
            brew trust schildawg/algol24
            brew install algol24-vm   # the machine and its library
            brew install algol24      # the compiler
            ```

            The two coexist: one installs `algvm`, the other `algc`.
